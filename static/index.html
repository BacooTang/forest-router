<section class="login" id="login"><h2>管理员登录</h2><div class="tagline">统一管理模型、渠道与运行状态</div><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码" required><button class="primary">登录</button></form></section>

<script>
'use strict';
let checkingAll=false,draggingChannel=false;
let data=null,view='配置中心',selected='',editing=false,refreshing=false,noticeTimer;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2),clone=x=>JSON.parse(JSON.stringify(x));
function setDrawer(open){document.body.classList.toggle('drawer-open',open);$('menuToggle').setAttribute('aria-expanded',String(open));$('content').inert=open;if(open)$('menuClose').focus();else if(document.activeElement?.closest('#sidebar'))$('menuToggle').focus()}
$('menuToggle').onclick=()=>setDrawer(!document.body.classList.contains('drawer-open'));
$('menuClose').onclick=$('sidebarBackdrop').onclick=()=>setDrawer(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setDrawer(false);if(e.key==='Tab'&&document.body.classList.contains('drawer-open')){const nodes=[...$('sidebar').querySelectorAll('button,input,select')].filter(x=>!x.disabled&&x.getClientRects().length);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
matchMedia('(max-width:740px)').addEventListener('change',()=>setDrawer(false));
const badges={healthy:['满血','green'],degraded:['降智','purple'],unknown:['检测异常','orange']};
const adapters={auto:'自动识别',new_api:'New API',sub2_api:'Sub2API',subscription:'订阅额度',deepseek:'DeepSeek 官方',glm:'智谱 Coding Plan'};
function toast(message){$('notice').textContent=message;$('notice').classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').classList.add('hidden'),6000)}
async function api(path,body){const r=await fetch('/admin/api/'+path,{method:body===undefined?'GET':'POST',headers:{'content-type':'application/json','x-forest-admin':'1'},body:body===undefined?undefined:JSON.stringify(body)});if(r.status===401){$('login').classList.remove('hidden');$('app').classList.add('hidden');throw Error('请登录管理员账号')}if(!r.ok){let text=await r.text();try{text=JSON.parse(text).error||text}catch{}throw Error(text||'操作失败')}return r.json()}
function toggle(enabled,action,id,label){return `<button type="button" role="switch" aria-checked="${enabled}" aria-label="${esc(label)}" title="${enabled?'点击停用':'点击启用'}" class="toggle ${enabled?'on':''}" data-action="${action}" data-id="${esc(id)}"></button>`}
function badge(t,c=''){return `<span class="badge ${c}">${esc(t)}</span>`}function stamp(t){return t?new Date(t*1000).toLocaleString('zh-CN',{hour12:false}):'尚未检查'}
function keyReason(s={}){const n=Date.now()/1000;if(s.probe_exhausted)return ['待手动验证','red'];if(s.credential_failed)return ['凭证失效','red'];if(s.allowance?.exhausted||(s.allowance?.expires_at&&s.allowance.expires_at<=n))return ['额度耗尽','orange'];if(s.cooldown_until>n)return ['冷却至 '+new Date(s.cooldown_until*1000).toLocaleTimeString(),'orange'];if(s.service_failed)return ['服务不可用','red'];if(s.retry_at>n)return ['限流等待','orange'];return ['可用','green']}
function quality(c){if(!c.monitor_id)return ['未监控',''];const q=data.state.quality[c.monitor_id];if(!q)return ['等待检测','orange'];if(q.verdict==='unknown'&&q.error)return ['检测异常'+(/^HTTP \d{3}$/.test(q.error)?' · '+q.error:''),'orange'];if(q.last_definite==='degraded'||q.verdict==='degraded')return ['降智','purple'];if(q.valid_until<=Date.now()/1000)return ['结果过期','orange'];if(q.verdict==='unknown'&&q.last_definite==='healthy')return ['沿用上次满血','orange'];return badges[q.verdict]||['质量未知','orange']}
function serviceStatus(c){
 if(!c.enabled)return ['服务已停用',''];
 const keys=c.keys.filter(k=>k.enabled!==false);
 if(!keys.length)return ['服务已停用',''];
 const available=keys.filter(k=>keyReason(data.state.keys[k.id]||{})[0]==='可用');
 if(!available.length)return ['服务不可用','red'];
 if(available.some(k=>data.state.keys[k.id]?.checked))return ['服务可用','green'];
 return ['服务未验证','orange'];
}
function serviceBadge(c){const [label,color]=serviceStatus(c);const keys=c.keys.filter(k=>k.enabled!==false);const detail=!c.enabled?'提供者已关闭':!keys.length?'全部Key已关闭':keys.map(k=>(k.label||'Key')+'：'+(keyReason(data.state.keys[k.id]||{})[0]==='可用'&&!data.state.keys[k.id]?.checked?'尚无成功的服务验证记录':keyReason(data.state.keys[k.id]||{})[0])).join('；');return `<span class="badge ${color}" title="${esc(detail)}">${label}</span>`}
function reason(c){if(!c.enabled)return ['已停用',''];if(!c.keys.some(k=>k.enabled!==false))return ['全部Key已停用',''];const q=quality(c);if(c.monitor_id&&!['满血','沿用上次满血'].includes(q[0]))return q;const states=c.keys.filter(k=>k.enabled!==false).map(k=>data.state.keys[k.id]||{}),reasons=states.map(keyReason);if(reasons.some(r=>r[0]==='可用'))return ['可用','green'];return reasons[0]||['全部Key已停用','']}
function allowance(a){if(!a)return '额度未知';if(a.windows?.length)return a.windows.map(w=>`${w.label} 剩余 ${w.remaining_percent??'?'}%${w.resets_at?' · 重置 '+new Date(w.resets_at).toLocaleString():''}`).join(' / ');if(a.unlimited)return 'Key 无限额度 · 账号余额未知';return a.remaining!=null?`${Number(a.remaining).toFixed(2)} ${a.unit==='quota'?'额度单位':a.unit}`:'额度未知'}
async function refresh(){if(document.body.classList.contains('drawer-open')||draggingChannel||document.querySelector('.timeline:hover,.timeline:focus-within,.monitor-details[open],.trace-detail[open],#traceSearch:focus')||refreshing||editing||$('dialog').open)return;refreshing=true;try{data=await api('state');$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}catch(e){if(data)toast('状态刷新失败，稍后自动重试')}finally{refreshing=false}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{password:$('password').value});$('password').value='';await refresh()}catch(e){toast(e.message)}};
function bindActions(root){root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id,b))}
function shortTime(t){return t?new Date(t*1000).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'尚未检查'}
function chartTime(t){return new Date(t*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}
function timeline(history,end){
 const start=end-71*300,slots=new Map();
 for(const point of history){const slot=Math.floor(point.at/300)*300;if(slot>=start&&slot<=end){const list=slots.get(slot)||[];list.push(point);slots.set(slot,list)}}
 let bars='',ticks='';
 for(let i=0;i<72;i++){
  const at=start+i*300,points=(slots.get(at)||[]).sort((a,b)=>a.at-b.at),last=points.at(-1);
  const text=points.length?points.map(p=>chartTime(p.at)+' · '+(badges[p.verdict]?.[0]||'未知')).join('\n'):chartTime(at)+'–'+new Date((at+300)*1000).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' · 无数据／中断';
  bars+=`<button type="button" class="bar ${last?esc(last.verdict):''}" data-chart-tip="${esc(text)}" aria-label="${esc(text)}"></button>`;
  if(at%3600===0)ticks+=`<span style="left:${(i+.5)/72*100}%">${new Date(at*1000).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false})}</span>`;
 }
 return `<div class="timeline"><div class="bars">${bars}</div><div class="time-axis">${ticks}</div></div>`;
}
const chartTooltip=document.createElement('div');chartTooltip.className='chart-tooltip hidden';chartTooltip.setAttribute('role','tooltip');document.body.appendChild(chartTooltip);
function showChartTip(target){if(!target?.matches('[data-chart-tip]'))return;chartTooltip.textContent=target.dataset.chartTip;chartTooltip.classList.remove('hidden');const r=target.getBoundingClientRect(),box=chartTooltip.getBoundingClientRect();chartTooltip.style.left=Math.max(8,Math.min(r.left,innerWidth-box.width-8))+'px';chartTooltip.style.top=Math.max(8,r.top-box.height-8)+'px'}
document.addEventListener('pointerover',e=>showChartTip(e.target));document.addEventListener('focusin',e=>showChartTip(e.target));
for(const event of ['pointerout','focusout'])document.addEventListener(event,e=>{if(e.target.matches('[data-chart-tip]'))chartTooltip.classList.add('hidden')});
function render(){chartTooltip.classList.add('hidden');$('mobileTitle').textContent=view+(view==='配置中心'&&selected?' · '+selected:'');
 const configuration=view==='配置中心';
 $('models').classList.toggle('hidden',!configuration);
 $('app').classList.toggle('single-content',!configuration);
 $('nav').innerHTML=['配置中心','运行统计','降智监控','日志','设置'].map((x,i)=>`<button data-action="view" data-id="${x}" class="${view===x?'active':''}">${['◈','▥','◉','≡','⚙'][i]} &nbsp;${x}</button>`).join('')+'<div class="foot muted">轻量 · 本地存储<br>仅 Responses 透传</div>';bindActions($('nav'));
 if(!data.config.models.some(m=>m.id===selected))selected=data.config.models[0]?.id||'';
 $('models').innerHTML='<div class="row between"><span class="muted">模型</span><button class="tiny" data-action="add-model">＋</button></div>'+data.config.models.map(m=>`<button class="model ${selected===m.id?'active':''}" data-action="model" data-id="${esc(m.id)}">${esc(m.id)}<br><span class="muted">${m.channels.length} 个渠道</span></button>`).join('');bindActions($('models'));
 const content=$('content');
 if(view==='运行统计'){renderTraffic();return}

function bindChannelDrag(root){
 for(const handle of root.querySelectorAll('.drag-handle')){
  handle.onpointerdown=e=>{
   if(e.button!==0||draggingChannel)return;e.preventDefault();
   const card=handle.closest('[data-channel-id]'),modelId=selected,cfg=clone(data.config),channels=cfg.models.find(m=>m.id===modelId).channels;
   draggingChannel=true;card.classList.add('dragging');
   document.onpointermove=event=>{const others=[...root.querySelectorAll('[data-channel-id]')].filter(x=>x!==card);const next=others.find(x=>event.clientY<x.getBoundingClientRect().top+x.getBoundingClientRect().height/2);if(next)root.insertBefore(card,next);else root.appendChild(card);if(event.clientY<60)window.scrollBy(0,-20);else if(event.clientY>innerHeight-60)window.scrollBy(0,20)};
   const finish=async event=>{
    document.onpointermove=null;document.onpointerup=null;document.onpointercancel=null;card.classList.remove('dragging');
    try{
     if(event.type==='pointercancel'){render();return}
     const ids=[...root.querySelectorAll('[data-channel-id]')].map(x=>x.dataset.channelId);
     if(ids.some((id,i)=>id!==channels[i].id)){cfg.models.find(m=>m.id===modelId).channels=ids.map(id=>channels.find(c=>c.id===id));await saveConfig(cfg)}else render();
    }catch(error){toast(error.message);render()}finally{draggingChannel=false}
   };document.onpointerup=finish;document.onpointercancel=finish;
  };
  handle.onkeydown=async e=>{if(!['ArrowUp','ArrowDown'].includes(e.key)||draggingChannel)return;e.preventDefault();const id=handle.closest('[data-channel-id]').dataset.channelId;draggingChannel=true;try{await action(e.key==='ArrowUp'?'up':'down',id,handle)}finally{draggingChannel=false}};
 }
}

}
function renderSettings(){const c=data.config;$('content').innerHTML=`<div class="settings"><h1>设置</h1><form id="settingsForm">${field('公司统一 API Key（明文）','apiKey',c.api_key)}${field('飞书 Webhook','webhook',c.webhook)}<div class="field"><label class="check"><input type="checkbox" id="notifyAllMonitors" ${c.notify_all_monitors?'checked':''}>飞书推送全量降智监控</label><p class="muted">每轮检测后推送汇总卡片，包含全部监控及本轮未检测项。关闭时仅通知降智状态变化。</p></div>${field('修改管理员密码（留空保持原密码）','newPassword','','password')}<div class="field"><label for="listenPort">监听端口</label><input id="listenPort" value="${esc(c.listen.split(':').pop())}" readonly aria-readonly="true"></div><button class="primary">保存设置</button></form></div>`;$('settingsForm').oninput=()=>editing=true;$('settingsForm').onsubmit=async e=>{e.preventDefault();try{await saveConfig({...data.config,api_key:$('apiKey').value,webhook:$('webhook').value.trim(),notify_all_monitors:$('notifyAllMonitors').checked,new_password:$('newPassword').value})}catch(e){toast(e.message)}}}
async function action(a,id,b){try{
 if(a==='view'){editing=false;view=id;setDrawer(false);render()}else if(a==='model'){view='配置中心';selected=id;setDrawer(false);render()}else if(a==='add-model')modelForm();else if(a==='edit-model')modelForm(data.config.models.find(m=>m.id===id));else if(a==='add-channel')channelForm();else if(a==='edit-channel')channelForm(data.config.models.find(m=>m.id===selected).channels.find(c=>c.id===id));else if(a==='monitor-schedule')scheduleForm();else if(a==='add-monitor')monitorForm();else if(a==='edit-monitor')monitorForm(data.config.monitors.find(m=>m.id===id));
 else if(a==='toggle-channel'||a==='toggle-key'){b.disabled=true;const cfg=clone(data.config);for(const m of cfg.models)for(const c of m.channels){if(a==='toggle-channel'&&c.id===id)c.enabled=!c.enabled;else if(a==='toggle-key'){const k=c.keys.find(k=>k.id===id);if(k)k.enabled=k.enabled===false}}await saveConfig(cfg)}
 else if(a==='up'||a==='down'){const cfg=clone(data.config),cs=cfg.models.find(m=>m.id===selected).channels,i=cs.findIndex(c=>c.id===id),j=i+(a==='up'?-1:1);if(j<0||j>=cs.length)return;[cs[i],cs[j]]=[cs[j],cs[i]];await saveConfig(cfg)}
 else if(a==='verify-all-monitors'){
  if(checkingAll)return;const monitors=[...data.config.monitors];if(!monitors.length)return;
  checkingAll=true;render();let completed=0;const errors=[];
  try{const result=await api('verify',{all_monitors:true});completed=result.completed;if(completed<monitors.length)errors.push('部分监控忙碌或配置已变化')}catch(e){errors.push(e.message)}
  finally{checkingAll=false;await refresh();if(view==='降智监控')render()}
  toast('检测执行完成 '+completed+' / '+monitors.length+(errors.length?'；'+errors.join('；'):'，状态已更新'));
 }
 else if(['verify','reset','verify-monitor'].includes(a)){b.disabled=true;b.textContent='验证中…';await api('verify',a==='verify-monitor'?{monitor_id:id}:{channel_id:id,reset:a==='reset'});toast('验证完成，状态已更新');await refresh()}
 }catch(e){toast(e.message)}finally{if(b)b.disabled=false}}
setInterval(refresh,5000);refresh();
</script></body></html>
